inherits: "grpo_dpo_z.yaml"
run_name: "grpo_dpo_z_sync_diagnostic"

grpo:
  num_samples: 24
  num_generations: 8
  generation_batch_size: 8
  max_completion_length: 2048
  max_model_len: 3072
  mask_truncated_completions: false
  vllm_gpu_memory_utilization: 0.12
  verify_vllm_weight_sync: true
  require_vllm_weight_change_after_step: true
  log_completions: true
  num_completions_to_print: 8

training:
  seed: 42
  max_steps: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 1.5e-6
  lr_scheduler_type: "constant"
  warmup_ratio: 0.0
  save_steps: 1
  save_total_limit: 3
  logging_steps: 1
