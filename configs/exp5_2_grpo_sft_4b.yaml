# Exp 5.2-4B: Vanilla GRPO starting from SFT-trained Qwen3.5-4B-Base checkpoint
run_name: "exp5_2_grpo_sft_4b"

model:
  name: "outputs/exp2_1_full_ft_4b"

grpo:
  loss_type: "grpo"
  max_completion_length: 16384
  vllm_gpu_memory_utilization: 0.25  # Space for vLLM KV-Cache blocks (matches PRIME)
  vllm_enable_sleep_mode: false  # Disable sleep mode to preserve synchronized weights in colocated mode
  temperature: 0.7

training:
  optim: paged_adamw_8bit       # 8-bit optimizer to save VRAM
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 64  # 64 completions = 8 prompts per step (187 steps total per epoch)
  save_total_limit: 2           # Only keep latest 2 checkpoints to avoid disk out-of-space
  save_only_model: false        # Save optimizer states to allow resumption
  save_steps: 50                # Save every 50 steps
