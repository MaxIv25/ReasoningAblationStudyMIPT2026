# Exp 5.6: PRIME with Hybrid Offloading and weight sync for 4B model (Qwen/Qwen3.5-4B-Base)
run_name: "exp5_6_prime_4b_hybrid"

model:
  name: "outputs/exp2_1_full_ft_4b"

grpo:
  max_completion_length: 16384  # 16K context
  vllm_enable_sleep_mode: false  # Prevent losing synchronized weights in colocated mode
  vllm_importance_sampling_correction: false
  vllm_gpu_memory_utilization: 0.25  # Space for vLLM KV-Cache blocks
  temperature: 1.0             # Must match PRM/ref (no temperature scaling anywhere)

prime:
  enabled: true
  beta: 0.05
  prm_lr: 1.0e-6
  prm_update_epochs: 1          # Set to 1 to cut PRM update time in half and prevent overfitting
  advantage_baseline: "rloo"
  online_filter: true
  gamma: 1.0                   # No discounting — process returns = simple reverse cumsum
  prm_ref_batch_size: 8        # Stable and extremely fast reference model forward pass
  prm_grad_batch_size: 1        # Keep at 1 for 100% OOM-proof stability on H200 with 16K sequences
  cpu_offload_policy: false     # Policy model permanently on GPU to save massive PCIe latency
  cpu_offload_aux: true         # Reference and PRM models dynamically offloaded to CPU to save VRAM

training:
  optim: paged_adamw_8bit       # Use 8-bit paged AdamW for Policy model to save 25.8GB of VRAM!
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 64  # 64 completions = 8 prompts per step (187 steps total per epoch)
  save_total_limit: 2           # Only keep latest 2 checkpoints to avoid disk out-of-space
  save_only_model: false        # Save optimizer states to allow resumption
  save_steps: 50                # Save every 50 steps
  resume_from_checkpoint: true   # Auto-detect latest checkpoint in output_dir
